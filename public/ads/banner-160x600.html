<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advertisement 160x600</title>
    <style>html,body{width:160px;height:600px;margin:0;overflow:hidden;background:transparent}</style>
  </head>
  <body>
    <script>
      var atOptions = {
        key: new URLSearchParams(location.search).get('key')?.trim() || '',
        format: 'iframe',
        height: 600,
        width: 160,
        params: {}
      };

      if (atOptions.key) {
        document.write('<script src="https://www.highperformanceformat.com/' + atOptions.key + '/invoke.js"><\/script>');
      }
    </script>
  </body>
</html>
